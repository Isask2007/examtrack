{% extends "base.html" %}
{% block title %}{{ 'Edit Subject' if subject else 'Add Subject' }}{% endblock %}
{% block content %}
<div class="page-header">
  <a class="btn btn-link ps-0" href="{{ url_for('admin.subjects') }}"><i class="bi bi-arrow-left me-1"></i>Back to subjects</a>
  <h1 class="page-title">{{ 'Edit Subject' if subject else 'Add Subject' }}</h1>
</div>
<div class="card app-card">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card-body row g-3">
      <div class="col-md-3">
        <label class="form-label" for="code">Subject Code *</label>
        <input class="form-control" id="code" name="code" value="{{ form.get('code', subject.code if subject else '') }}" required>
      </div>
      <div class="col-md-5">
        <label class="form-label" for="name">Subject Name *</label>
        <input class="form-control" id="name" name="name" value="{{ form.get('name', subject.name if subject else '') }}" required>
      </div>
      <div class="col-md-2">
        <label class="form-label" for="course_id">Course *</label>
        <select class="form-select" id="course_id" name="course_id" required>
          <option value="">Select</option>
          {% set sc = form.get('course_id', subject.course_id if subject else '')|string %}
          {% for course in courses %}<option value="{{ course.id }}" {{ 'selected' if sc == course.id|string }}>{{ course.code }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label" for="semester_id">Semester *</label>
        <select class="form-select" id="semester_id" name="semester_id" required>
          <option value="">Select</option>
          {% set ss = form.get('semester_id', subject.semester_id if subject else '')|string %}
          {% for semester in semesters %}<option value="{{ semester.id }}" {{ 'selected' if ss == semester.id|string }}>Sem {{ semester.number }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label" for="credits">Credits *</label>
        <input class="form-control" type="number" min="1" max="10" id="credits" name="credits" value="{{ form.get('credits', subject.credits if subject else 3) }}" required>
      </div>
      <div class="col-10">
        <label class="form-label" for="description">Description</label>
        <input class="form-control" id="description" name="description" value="{{ form.get('description', subject.description if subject and subject.description else '') or '' }}">
      </div>
      <div class="col-12">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {{ 'checked' if (subject and subject.is_active) or (not subject and not form) }}>
          <label class="form-check-label" for="is_active">Active</label>
        </div>
      </div>
    </div>
    <div class="card-footer bg-white border-0 d-flex gap-2">
      <button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle me-1"></i>Save Subject</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('admin.subjects') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
